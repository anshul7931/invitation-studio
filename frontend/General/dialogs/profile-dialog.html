<dialog class="profile-dialog" id="profileDialog">
    <form class="profile-content" id="profileForm">
      <h2 id="accountDialogTitle">Your profile</h2>
      <section class="account-section" data-account-panel="profile">
      <div class="field">
        <label for="profileName">Name</label>
        <input id="profileName" name="name" required>
      </div>
      <div class="field">
        <label for="profileEmail">Email address</label>
        <input type="email" id="profileEmail" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="profilePhone">Phone number</label>
        <input type="tel" id="profilePhone" name="phone" autocomplete="tel" placeholder="Optional">
      </div>
      <div class="profile-verify" id="profileVerifyNotice" hidden>
        <span>Please verify your email address.</span>
        <button class="text-button" id="resendVerificationButton" type="button">Resend verification email</button>
      </div>
      </section>
      <section class="account-section" data-account-panel="settings" hidden>
      <div class="field">
        <label for="profileAppTheme">Application colour theme</label>
        <select id="profileAppTheme" name="appTheme">
          <option value="maroon">Maroon</option>
          <option value="royal-blue">Royal Blue</option>
          <option value="emerald">Emerald</option>
          <option value="rose-gold">Rose Gold</option>
          <option value="sapphire">Sapphire</option>
          <option value="lavender">Lavender</option>
          <option value="terracotta">Terracotta</option>
        </select>
      </div>
      <div class="field">
        <label for="profileModeTheme">Display mode</label>
        <select id="profileModeTheme" name="modeTheme">
          <option value="light">Light mode</option>
          <option value="dark">Dark mode</option>
        </select>
      </div>
      <div class="field">
        <label for="profileFontTheme">Font style</label>
        <select id="profileFontTheme" name="fontTheme">
          <option value="default">Default font</option>
          <option value="classic">Classic serif</option>
          <option value="modern">Modern clean</option>
          <option value="script">Script headings</option>
        </select>
      </div>
      </section>
      <section class="account-section" data-account-panel="plans" hidden>
      <section class="profile-ledger">
        <h3>Plan details</h3>
        <div id="profilePlanDetails" class="mini-ledger"></div>
      </section>
      <section class="profile-ledger">
        <h3>Transaction statement</h3>
        <div id="profileTransactions" class="mini-ledger"></div>
      </section>
      </section>
      <p class="auth-message" id="profileMessage"></p>
      <div class="dialog-actions">
        <button class="generate-button" id="saveAccountButton" type="submit">Save profile</button>
        <button class="text-button" id="closeProfileButton" type="button">Close</button>
      </div>
    </form>
  </dialog>
