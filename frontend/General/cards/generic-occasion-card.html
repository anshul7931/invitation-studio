<main class="occasion-invitation" id="occasionInvitation" data-occasion="birthday" hidden>
    <div class="occasion-card-inner">
      <div class="occasion-mark" id="occasionMark" aria-hidden="true"></div>
      <p class="occasion-card-kicker" id="occasionCardKicker"></p>
      <h1 class="occasion-card-title" id="occasionCardTitle"></h1>
      <p class="occasion-card-subtitle" id="occasionCardSubtitle"></p>
      <p class="occasion-card-message" id="occasionCardMessage"></p>
      <section class="event-countdown" id="occasionCountdown" hidden aria-label="Event countdown"></section>
      <div class="photo-gallery" id="occasionPhotoGallery" hidden></div>
      <div class="occasion-details" id="occasionDetails"></div>
      <a class="venue-directions" id="occasionDirections" target="_blank" rel="noopener noreferrer" hidden>View map &amp; directions</a>
      <p class="occasion-card-rsvp" id="occasionCardRsvp"></p>
    </div>
  </main>
