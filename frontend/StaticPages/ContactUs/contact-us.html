<section class="static-page" id="contactPage" hidden>
  <p class="builder-kicker">We’re listening</p>
  <h1>Contact Us</h1>
  <p>Share a question, report an issue, or send feedback. Our team will review your message.</p>
  <form id="contactForm" class="contact-form" novalidate>
    <div class="form-grid">
      <div class="field"><label for="contactName">Your name</label><input id="contactName" name="name" autocomplete="name" required maxlength="120"></div>
      <div class="field"><label for="contactEmail">Email address</label><input id="contactEmail" name="email" type="email" autocomplete="email" required maxlength="255"></div>
      <div class="field"><label for="contactPhone">Phone (optional)</label><input id="contactPhone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
      <div class="field"><label for="contactCategory">What is this about?</label><select id="contactCategory" name="category"><option>Feedback</option><option>Technical issue</option><option>Feature request</option><option>Billing</option><option>Other</option></select></div>
      <div class="field full"><label for="contactSubject">Subject</label><input id="contactSubject" name="subject" required maxlength="160"></div>
      <div class="field full"><label for="contactMessage">How can we help?</label><textarea id="contactMessage" name="message" rows="6" required maxlength="10000"></textarea></div>
    </div>
    <button class="generate-button" type="submit">Submit</button>
    <p id="contactStatus" class="contact-status" role="status" aria-live="polite"></p>
  </form>
</section>
